apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: basic-application
spec:
  schema:
    apiVersion: v1alpha1
    kind: BasicApplication
    group: isbester.com

    spec:
      name: string | required=true immutable=true minLength=3 maxLength=64
      image: string | default="nginx:latest"
      replicas: integer | default=3
      ingress:
        enabled: boolean | default=false
        host: string | default="isbester.com"
      autoscaling:
        enabled: boolean | default=true
        profile: string | default="service" enum="service"
      env: map[string]string

    status:
      endpoint: '${service.metadata.name}'
      healthStatus: '${deployment.status.availableReplicas >= deployment.spec.replicas ? "healthy" : "degraded"}'
      availableReplicas: '${deployment.status.availableReplicas}'

    additionalPrinterColumns:
      - name: Endpoint
        type: string
        description: The endpoint of the application.
        jsonPath: .status.endpoint
      - name: Health Status
        type: string
        description: The health status of the application.
        jsonPath: .status.healthStatus
      - name: Available Replicas
        type: integer
        description: The number of available replicas.
        jsonPath: .status.availableReplicas

  resources:
    - id: config
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: '${schema.spec.name}-config'
          labels:
            app.kubernetes.io/name: '${schema.spec.name}'
            app.kubernetes.io/instance: '${schema.metadata.name}'
        data: '${schema.spec.env}'

    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: '${schema.spec.name}'
          labels:
            app.kubernetes.io/name: '${schema.spec.name}'
            app.kubernetes.io/instance: '${schema.metadata.name}'
        spec:
          replicas: '${schema.spec.replicas}'
          selector:
            matchLabels:
              app.kubernetes.io/name: '${schema.spec.name}'
              app.kubernetes.io/instance: '${schema.metadata.name}'
          template:
            metadata:
              labels:
                app.kubernetes.io/name: '${schema.spec.name}'
                app.kubernetes.io/instance: '${schema.metadata.name}'
            spec:
              containers:
                - name: app
                  image: '${schema.spec.image}'
                  ports:
                    - containerPort: 80
                  envFrom:
                    - configMapRef:
                        name: '${config.metadata.name}'

    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: '${schema.spec.name}'
          labels:
            app.kubernetes.io/name: '${schema.spec.name}'
            app.kubernetes.io/instance: '${schema.metadata.name}'
        spec:
          type: ClusterIP
          selector:
            app.kubernetes.io/name: '${schema.spec.name}'
            app.kubernetes.io/instance: '${schema.metadata.name}'
          ports:
            - port: 80
              targetPort: 80
              protocol: TCP
              name: http

    - id: ingress
      includeWhen:
        - ${schema.spec.ingress.enabled}
      template:
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: '${schema.spec.name}'
          labels:
            app.kubernetes.io/name: '${schema.spec.name}'
            app.kubernetes.io/instance: '${schema.metadata.name}'
        spec:
          rules:
            - host: '${schema.spec.ingress.host}'
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: '${service.metadata.name}'
                        port:
                          number: 80

    - id: hpa
      includeWhen:
        - '${schema.spec.autoscaling.enabled}'
      template:
        apiVersion: autoscaling/v2
        kind: HorizontalPodAutoscaler
        metadata:
          name: '${schema.spec.name}'
          labels:
            app.kubernetes.io/name: '${schema.spec.name}'
            app.kubernetes.io/instance: '${schema.metadata.name}'
        spec:
          scaleTargetRef:
            apiVersion: apps/v1
            kind: Deployment
            name: '${deployment.metadata.name}'
          minReplicas: '${schema.spec.replicas}'
          maxReplicas: 10
          metrics:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: 80
